<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Headway Beginner · Uy vazifasi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f4f6fb;--card:#fff;--ink:#1f2433;--mute:#6b7285;--line:#e3e6ef;--acc:#2f6fdb;--ok:#1f9d55;--okbg:#e7f7ee;--bad:#d64545;--badbg:#fdecec;--soft:#e8f0fd;--r:16px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5}
button{font-family:inherit;font-size:inherit;color:inherit}
header{background:var(--acc);color:#fff;padding:26px 16px 22px}
.wrap{max-width:760px;margin:0 auto}
header h1{margin:0;font-size:30px;font-weight:800;line-height:1.2}
header h1 small{font-size:21px;font-weight:600;opacity:.95}
header p{margin:6px 0 0;opacity:.95}
header .by{font-weight:700;font-size:15px}
header a{color:#fff}
.topbtns{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.22);border:0;color:#fff;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer}
.pill:hover{background:rgba(255,255,255,.33)}
main{max-width:760px;margin:0 auto;padding:18px 14px 40px}
.card{background:var(--card);border-radius:var(--r);padding:20px 18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.card h3{margin:0 0 2px;font-size:18px}
.card h2{margin:0 0 4px}
.hint{color:var(--mute);font-style:italic;font-size:13.5px;margin-bottom:12px}
label.lbl{font-weight:700;display:block;margin-bottom:8px}
input[type=text],textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;background:#fff;outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--acc)}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:14px 0 6px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.small{font-size:13.5px;color:var(--mute)}
.unit{display:block;width:100%;text-align:left;border:0;background:var(--card);border-radius:var(--r);padding:18px 18px 16px 22px;margin-bottom:14px;cursor:pointer;box-shadow:0 1px 3px rgba(20,30,60,.06);border-left:7px solid var(--c);transition:transform .12s}
.unit:hover{transform:translateY(-2px)}
.unit .tag{color:var(--c);font-weight:800;font-size:13px;letter-spacing:.3px}
.unit h2{margin:6px 0 4px;font-size:21px}
.unit h2 span{font-weight:400;color:var(--mute);font-size:17px}
.unit .tp{color:var(--mute);font-size:14px}
.unit .bar i{background:var(--c)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tab{border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 4px;font-weight:800;font-size:14px;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.w{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 8px;cursor:pointer;text-align:center}
.w b{display:block;font-size:17px}
.w span{display:block;color:var(--mute);font-size:13.5px;line-height:1.3;margin-top:3px}
.w:hover{border-color:var(--acc)}
.stage{font-weight:800;color:var(--acc);font-size:13px;margin:12px 0 8px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.match>div{display:flex;flex-direction:column;gap:8px}
.mb{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;cursor:pointer;min-height:46px}
.mb.sel{border-color:var(--acc);background:var(--soft)}
.mb.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);cursor:default}
.mb.bad{border-color:var(--bad);background:var(--badbg);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.q{border-top:1px solid var(--line);padding:12px 0 4px}
.q:first-of-type{border-top:0}
.qt{margin-bottom:8px}
.qt .n{color:var(--acc);font-weight:800;margin-right:6px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.row{flex-direction:row;flex-wrap:wrap}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 14px;cursor:pointer;text-align:left}
.opt:hover{border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.in{display:flex;gap:8px;align-items:stretch}
.in input{flex:1;min-width:0}
.btn{border:0;background:var(--acc);color:#fff;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--acc);border:2px solid var(--line)}
.in input.ok{border-color:var(--ok);background:var(--okbg)}
.in input.bad{border-color:var(--bad);background:var(--badbg)}
.fb{font-size:14px;margin-top:5px;min-height:0}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.rule{background:var(--soft);border-radius:12px;padding:11px 14px;font-size:14.5px;margin-bottom:8px}
.text p{font-size:17px;line-height:1.85;margin:0 0 12px}
.gl{border:0;background:none;padding:0;border-bottom:2px dotted var(--acc);cursor:pointer;font-size:inherit;position:relative}
.gl.show::after{content:attr(data-t);position:absolute;left:50%;bottom:120%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:4px 9px;border-radius:8px;white-space:nowrap;z-index:5}
details summary{cursor:pointer;color:var(--acc);font-weight:800;margin-top:12px}
details p{color:#3a4152;margin:8px 0}
.listen{margin-top:4px}
.tray{display:flex;flex-wrap:wrap;gap:7px;min-height:48px;border:2px dashed var(--line);border-radius:12px;padding:7px;margin-bottom:8px}
.tray.ok{border-color:var(--ok);background:var(--okbg)}
.tray.bad{border-color:var(--bad);background:var(--badbg)}
.chip{border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;cursor:pointer}
.chip.used{visibility:hidden}
.err{display:flex;flex-wrap:wrap;gap:4px 6px;padding:6px 0 10px}
.ew{border:0;background:none;padding:5px 6px;border-radius:8px;cursor:pointer;font-size:17px}
.ew.sel{background:#fff1c9;outline:2px solid #e6b300}
.ew.ok{background:var(--okbg);outline:2px solid var(--ok)}
.ew.miss{background:var(--badbg);outline:2px solid var(--bad)}
.ew.wrong{text-decoration:line-through;color:var(--bad)}
.model{background:#f8f7f2;border-left:4px solid var(--acc);border-radius:10px;padding:12px 14px}
.model b{color:var(--acc)}
.checks{list-style:none;padding:0;margin:10px 0}
.checks li{padding:3px 0;color:var(--mute)}
.checks li.ok{color:var(--ok);font-weight:700}
.next{display:block;width:100%;margin-top:6px;padding:14px}
textarea{min-height:170px;resize:vertical;line-height:1.6}
footer{text-align:center;color:var(--mute);font-size:13.5px;padding:10px 14px 40px}
footer a{color:var(--acc)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.score{font-weight:800}
@media (max-width:560px){header h1{font-size:24px}header h1 small{font-size:17px}.tab{font-size:12.5px}.in{flex-wrap:wrap}.in input{flex-basis:100%}.in .btn{flex:1}.bank{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

z":"Sevimli narsalar","topics":"question words (savol so‘zlari) · pronouns: subject, object, possessive · this / that · adjectives (sifatlar) · Can I…? · in town","vocab":[["who","kim"],["what","nima"],["where","qayerda"],["when","qachon"],["why","nega"],["how","qanday"],["how many","nechta"],["how much","qancha"],["which","qaysi"],["favourite","sevimli"],["old","eski"],["new","yangi"],["hot","issiq"],["cold","sovuq"],["easy","oson"],["difficult","qiyin"],["fast","tez"],["slow","sekin"],["lovely","yoqimli"],["horrible","yoqimsiz, dahshatli"],["great","ajoyib"],["sunny","quyoshli"],["weather","ob-havo"],["post office","pochta"],["bank","bank"],["chemist’s","dorixona"],["Can I have…?","… bera olasizmi?"],["Can I help you?","Sizga yordam bera olamanmi?"],["mine","meniki"],["yours","sizniki"]],"reading":{"title":"An email from Samarkand","text":["Hi Emma! I’m on holiday in Samarkand with my friend Sara. It’s great! The weather is lovely — it’s sunny and hot. Our hotel is old, but it’s very nice. The food is wonderful. Sara loves plov — she eats it every day!","Yesterday we visited the Registan. It’s my favourite place here. The buildings are beautiful and very old. Sara takes a lot of photos — her camera is new and it’s very good.","Who is the man in the photo? That’s our guide, Bahodir. We like him a lot. He speaks English and Spanish! Why don’t you come next year? Love, Lucy"],"gloss":{"wonderful":"ajoyib","visited":"bordik, ziyorat qildik","buildings":"binolar","guide":"gid, yo‘lboshlovchi","next year":"kelasi yil"},"uz":["Salom, Emma! Men dugonam Sara bilan Samarqandda dam olyapman. Bu ajoyib! Ob-havo yoqimli — quyoshli va issiq. Mehmonxonamiz eski, lekin juda yaxshi. Taomlar ajoyib. Sara oshni juda yaxshi ko‘radi — har kuni yeydi!","Kecha Registonga bordik. Bu yerda u mening sevimli joyim. Binolar chiroyli va juda qadimiy. Sara ko‘p suratga oladi — uning fotoapparati yangi va juda yaxshi.","Suratdagi erkak kim? Bu bizning gidimiz Bahodir. U bizga juda yoqadi. U inglizcha va ispancha gapiradi! Nega kelasi yil kelmaysan? Mehr bilan, Lyusi"],"tf":[["The weather is cold.",false],["The hotel is old, but nice.",true],["The Registan is Lucy’s favourite place.",true],["Bahodir speaks Russian and Chinese.",false]],"mcq":[["What does Sara eat every day?",["plov","pizza","ice cream"]],["Who is Bahodir?",["their guide","Sara’s brother","a waiter"]],["What is Sara’s camera like?",["new and very good","old","small and cheap"]]],"find":[["ob-havo","weather"],["sevimli","favourite"],["kecha","yesterday"],["gid","guide"]]},"grammar":[{"name":"Question words","note":"<b>Who</b> (kim) · <b>What</b> (nima) · <b>Where</b> (qayerda) · <b>When</b> (qachon) · <b>Why</b> (nega) — <b>Because</b> (chunki) · <b>How</b> (qanday) · <b>How many</b> (nechta) · <b>How much</b> (qancha, narx) · <b>Which</b> (qaysi).","form":[["___ is your teacher? — Mr Karimov.","who"],["___ do you live? — In Kokand.","where"],["___ do you like Samarkand? — Because it’s beautiful.","why"],["How ___ brothers have you got? — Two.","many"],["___ is the class? — On Monday.","when"]],"choose":[["Nechta tilda gapirasiz?",["How many languages do you speak?","How much languages do you speak?","What many languages do you speak?"]],["Bu qancha turadi?",["How much is it?","How many is it?","What much is it?"]]]},{"name":"Pronouns: subject · object · possessive · this / that","note":"I → <b>me</b> → <b>my</b> → <b>mine</b> · you → <b>you</b> → <b>your</b> → <b>yours</b> · he → <b>him</b> → <b>his</b> · she → <b>her</b> → <b>her</b> → <b>hers</b> · we → <b>us</b> → <b>our</b> · they → <b>them</b> → <b>their</b>. Yaqin: <b>this</b>, uzoq: <b>that</b>.","form":[["I like Bahodir. I like ___ a lot. (he)","him"],["Where’s Sara? I can’t see ___. (she)","her"],["This book is ___. (I — meniki)","mine"],["Please help ___. (we)","us"],["Uzoqdagi: ___ is our hotel.","that"]],"choose":[["Bu sumka siznikimi?",["Is this bag yours?","Is this bag your?","Is this bag you?"]],["Men ularni yaxshi ko‘raman." "],["in front of","oldida"],["behind","orqasida"],["noisy","shovqinli"],["quiet","tinch, sokin"],["modern","zamonaviy"],["crowded","odam gavjum"],["turn left","chapga buriling"]],"reading":{"title":"My neighbourhood — Chilonzor, Tashkent","text":["I live in a flat in Chilonzor, a big district in the south-west of Tashkent. It’s a busy place, but my street is quiet. There are a lot of trees and there’s a small park opposite my building.","There’s a metro station near my flat, so it’s easy to get to the city centre. Next to the metro there’s a big market. I go there every Saturday for fruit and vegetables. There isn’t a cinema in my street, but there are two cafés and a pharmacy.","My flat isn’t big. There are three rooms: a living room, a bedroom and a small kitchen. In the living room there’s an old sofa and a beautiful carpet from my grandmother. I love my flat — it’s small, but it’s cosy."],"gloss":{"district":"tuman","busy":"gavjum, serqatnov","building":"bino","flat":"kvartira","cosy":"shinam"},"uz":["Men Chilonzordagi kvartirada yashayman — bu Toshkentning janubi-g‘arbidagi katta tuman. Bu gavjum joy, lekin mening ko‘cham tinch. Daraxtlar ko‘p, binomning qarshisida kichik bog‘ bor.","Kvartiram yaqinida metro bekati bor, shuning uchun shahar markaziga borish oson. Metro yonida katta bozor bor. Men u yerga har shanba meva-sabzavot uchun boraman. Ko‘chamda kinoteatr yo‘q, lekin ikkita kafe va dorixona bor.","Kvartiram katta emas. Uchta xona bor: mehmonxona, yotoqxona va kichik oshxona. Mehmonxonada eski divan va buvimdan qolgan chiroyli gilam bor. Kvartiramni yaxshi ko‘raman — u kichik, lekin shinam."],"tf":[["The writer’s street is very noisy.",false],["There is a park opposite the building.",true],["There is a cinema in the street.",false],["The flat has three rooms.",true]],"mcq":[["Where is the market?",["next to the metro","opposite the park","in the city centre"]],["When does the writer go to the market?",["every Saturday","every day","on Sunday evenings"]],["What is in the living room?",["an old sofa and a carpet","a wardrobe and a mirror","a big table"]]],"find":[["tinch","quiet"],["qarshisida","opposite"],["dorixona","pharmacy"],["gilam","carpet"]]},"grammar":[{"name":"there is / there are · Is there…? / Are there…?","note":"Birlik: <b>There’s</b> a park. Ko‘plik: <b>There are</b> two cafés. Inkor: <b>There isn’t</b> a bank. / <b>There aren’t any</b> shops. Savol: <b>Is there</b> a gym? — Yes, there <b>is</b>. / <b>Are there</b> any towels? — No, there <b>aren’t</b>.","form":[["___ a cinema in my town. (+)","there is|there's"],["___ three bedrooms. (+)","there are"],["There ___ a lift. (–)","isn't|is not"],["___ there Wi-fi in the room?","is"],["Are there any cafés? — Yes, there ___.","are"]],"choose":[["Mehmonxonada suzish havzasi bormi?",["Is there a swimming pool in the hotel?","Are there a swimming pool in the hotel?","There is a swimming pool in the hotel?"]],["Xonada sochiqlar yo‘q.",["There aren’t any towels in the room.","There isn’t any towels in the room.","There not towels in the room."]]]},{"name":"Prepositions of place","note":"<b>in</b> (ichida) · <b>on</b> (ustida) · <b>under</b> (ostida) · <b>next to</b> (yonida) · <b>opposite</b> (qarshisida) · <b>between</b> (orasida) · <b>in front of</b> (oldida) · <b>behind</b> (orqasida).","form":[["The book is ___ the table. (ustida)","on"],["The cat is ___ the bed. (ostida)","under"],["The bank is ___ the café. (yonida)","next to"],["The park is ___ my house. (qarshisida)","opposite"],["The shop is ___ the bank and the cinema. (orasida)","between"]],"choose":[["Telefon sumka ichida.",["The phone is in the bag.","The phone is on the bag.","The phone is at the bag."]],["Mashina uyning oldida.",["The car is in front of the house.","The car is in front the house.","The car is front of the house."]]]}],"build":[["There is a pharmacy next to the bank","Bank yonida dorixona bor."],["Are there any cafés in your street","Ko‘changizda kafelar bormi?"],["Go straight on and turn left","To‘g‘riga boring va chapga buriling."]],"writing":{"title":"Yo‘l-yo‘riq (directions) yozing","errors":{"text":"*There's two cafés near my house. Go *straigh on and turn left. The bank is *opposite of the museum.","fixed":"There are two cafés near my house. Go straight on and turn left. The bank is opposite the museum."},"modelTitle":"How to get to my flat","model":["Take the metro to Chilonzor station.","Go out of the station and turn right.","Go straight on for about 200 metres.","There’s a big market on your left. Don’t go into the market!","My building is opposite the small park. It’s number 14, flat 25."],"task":"Do‘stingizga uyingizgacha qanday yetib kelishni 5–8 gapda yozing. Buyruq shaklini (Go…, Turn…, Take…) ishlating.","min":5,"max":8,"checks":[["Kamida 5 ta gap",""],["Buyruq fe’li (Go / Turn / Take …)","\\b(go|turn|take|walk|cross)\\b"],["Joy predlogi (next to, opposite, between…)","(next to|opposite|between|in front of|behind|on your)"],["There is / There are","there (is|are|'s|’s)"]]}},{"n":9,"title":"Past times","uz":"O‘tgan zamonlar","topics":"was / were born · Past Simple: irregular verbs · saying years · have / do / go · months · ordinal numbers (tartib sonlar)","vocab":[["yesterday","kecha"],["last week","o‘tgan hafta"],["last year","o‘tgan yil"],["in 1990","1990-yilda"],["when I was seven","yetti yoshimda"],["then","o‘shanda"],["now","hozir"],["born","tug‘ilgan"],["school","maktab"],["teacher","o‘qituvchi"],["classmate","sinfdosh"],["start","boshlamoq"],["finish","tugatmoq"],["live","yashamoq"],["work","ishlamoq"],["study","o‘qimoq"],["move","ko‘chmoq"],["marry","turmush qurmoq"],["die","vafot etmoq"],["invent","ixtiro qilmoq"],["birthday","tug‘ilgan kun"],["wedding","to‘y"],["Happy birthday!","Tug‘ilgan kuningiz bilan!"],["Congratulations!","Tabriklayman!"],["Really?","Rostdanmi?"],["January","yanvar"],["March","mart"],["June","iyun"],["September","sentabr"],["first","birinchi"],["second","ikkinchi"],["third","uchinchi"]],"reading":{"title":"A life from the past — Ulugh Beg","text":["Ulugh Beg was born in 1394. His grandfather was Amir Temur. When he was a young man, Ulugh Beg lived in Samarkand. He was the ruler of the city, but he was also a great scientist.","He loved the stars. He studied them every night. In 1420 he opened a big school — a madrasa — on the Registan, and later he started an observatory. Scientists from many countries worked with him there.","Ulugh Beg and his scientists counted more than a thousand stars. People in Europe used his star tables for many years. He died in 1449, but today we remember him as a ruler and a scientist."],"gloss":{"ruler":"hukmdor","scientist":"olim","stars":"yulduzlar","observatory":"rasadxona","counted":"sanadi"},"uz":["Mirzo Ulug‘bek 1394-yilda tug‘ilgan. Uning bobosi Amir Temur edi. Yoshligida Ulug‘bek Samarqandda yashagan. U shahar hukmdori edi, lekin ayni paytda buyuk olim ham edi.","U yulduzlarni juda yaxshi ko‘rardi. Har kecha ularni o‘rganardi. 1420-yilda u Registonda katta maktab — madrasa ochdi, keyinroq esa rasadxona qurdirdi. U yerda u bilan ko‘plab mamlakatlardan kelgan olimlar ishladi.","Ulug‘bek va uning olimlari mingdan ortiq yulduzni sanadi. Yevropadagi odamlar uning yulduzlar jadvalidan ko‘p yillar foydalandi. U 1449-yilda vafot etdi, lekin bugun biz uni hukmdor va olim sifatida eslaymiz."],"tf":[["Ulugh Beg was born in 1394.",true],["His grandfather was a scientist from Europe.",false],["He opened a madrasa on the Registan.",true],["He counted about a hundred stars.",false]],"mcq":[["Where did Ulugh Beg live?",["in Samarkand","in Bukhara","in Europe"]],["What did he study every night?",["the stars","languages","maths books"]],["Who used his star tables?",["people in Europe","only his family","nobody"]]],"find":[["olim","scientist"],["yulduzlar","stars"],["tug‘ilgan","born"],["vafot etdi","died"]]},"grammar":[{"name":"Verb be — past: was / were","note":"I/he/she/it <b>was</b> · you/we/they <b>were</b>. Inkor: <b>wasn’t</b>, <b>weren’t</b>. Savol: <b>Were</b> you…? — Yes, I <b>was</b>. / <b>Was</b> she…? — No, she <b>wasn’t</b>.","form":[["I ___ at school yesterday.","was"],["We ___ in Khiva last year.","were"],["He ___ at home. (–)","wasn't|was not"],["___ you happy when you were a child?","were"],["Was it cold? — Yes, it ___.","was"]],"choose":[["Yetti yoshimda Namanganda edim.",["When I was seven, I was in Namangan.","When I were seven, I was in Namangan.","When I was seven, I were in Namangan."]],["Ular kecha uyda emas edi.",["They weren’t at home yesterday.","They wasn’t at home yesterday.","They didn’t at home yesterday."]]]},{"name":"Past simple — irregular verbs","note":"Noto‘g‘ri fe’llar -ed olmaydi: go → <b>went</b>, eat → <b>ate</b>, have → <b>had</b>, get → <b>got</b>, run → <b>ran</b>, win → <b>won</b>, lose → <b>lost</b>, begin → <b>began</b>, come → <b>came</b>, take → <b>took</b>.","form":[["go → ___","went"],["eat → ___","ate"],["win → ___","won"],["take → ___","took"],["begin → ___","began"]],"choose":[["Biz kecha sport zaliga bordik.",["We went to the gym yesterday.","We goed to the gym yesterday.","We gone to the gym yesterday."]],["U o‘tgan yili 10 kilo ozdi.",["She lost ten kilos last year.","She losed ten kilos last year.","She lose ten kilos last year."]]]}],"build":[["I was born in Samarkand","Men Samarqandda tug‘ilganman."],["We lived in a small house","Biz kichik uyda yashadik."],["My grandmother called me yesterday","Buvim kecha menga qo‘ng‘iroq qildi."]],"writing":{"title":"Biografiya yozing (a biography)","errors":{"text":"My grandfather *were born in 1950. He *work in a factory for 40 years. He *marryed my grandmother in 1975.","fixed":"My grandfather was born in 1950. He worked in a factory for 40 years. He married my grandmother in 1975."},"modelTitle":"My grandmother — Saodat","model":["My grandmother, Saodat, was born in 1955 in a village near Kokand.","Her parents were farmers.","She studied at a college in Fergana and she worked as a nurse for 35 years.","She married my grandfather in 1978. They lived in Kokand.","Now she lives with us. I love her very much!"],"task":"Oilangizdagi keksa odam yoki mashhur shaxs haqida 4–6 gapli biografiya yozing: qachon, qayerda tug‘ilgan, nima qilgan.","min":4,"max":6,"checks":[["Kamida 4 ta gap",""],["was / were","\\b(was|were)\\b"],["-ed fe’l (lived, worked…)","\\b\\w+ed\\b"],["Yil (in 1990 …)","\\b(in )?(1[89]|20)\\d\\d\\b"]]}},{"n":10,"title":"We had a good time!","uz":"Biz yaxshi vaqt o‘tkazdik!","topics":"Past Simple: regular & irregular · questions & negatives · time expressions · ago · weekend activities · sport & leisure · going sightseeing","vocab":[["go → went","bormoq → bordi"],["have → had","ega bo‘lmoq → edi"],["meet → met","uchrashmoq → uchrashdi"],["see → saw","ko‘rmoq → ko‘rdi"],["get → got","olmoq → oldi"],["come → came","kelmoq → keldi"],["buy → bought","sotib olmoq → sotib oldi"],["find → found","topmoq → topdi"],["lose → lost","yo‘qotmoq → yo‘qotdi"],["take → took","olmoq → oldi"],["eat → ate","yemoq → yedi"],["make → made","qilmoq → qildi"],["leave → left","ketmoq → ketdi"],["ago","oldin (… oldin)"],["two days ago","ikki kun oldin"],["the last time","oxirgi marta"],["excuse","bahona"],["late","kech"],["news","yangiliklar"],["memory","xotira"],["sunny","quyoshli"],["rainy","yomg‘irli"],["cloudy","bulutli"],["windy","shamolli"],["snowy","qorli"],["hot","issiq"],["cold","sovuq"],["warm","iliq"],["weather","ob-havo"],["concert","konsert"]],"reading":{"title":"A lucky day — a story from the news","text":["Two weeks ago, a taxi driver in Tashkent, Ravshan Aliyev, found a black bag in his car. A passenger left it there. In the bag there was a laptop, a passport and a lot of money.","Ravshan didn’t keep the bag. He went to the police and they found the owner — a businessman from Japan. The businessman didn’t have a phone number for Ravshan, so he came to the police station the next day.","He met Ravshan and gave him a present — a new watch. Did Ravshan take it? ‘Yes, I did,’ he said. ‘And now I always know what time it is!’"],"gloss":{"passenger":"yo‘lovchi","keep":"o‘zida qoldirmoq","owner":"egasi","present":"sovg‘a"},"uz":["Ikki hafta oldin Toshkentdagi taksi haydovchisi Ravshan Aliyev mashinasida qora sumka topdi. Uni yo‘lovchi qoldirib ketgan edi. Sumkada noutbuk, pasport va ko‘p pul bor edi.","Ravshan sumkani o‘zida qoldirmadi. U politsiyaga bordi va ular egasini topishdi — Yaponiyadan kelgan tadbirkor. Tadbirkorda Ravshanning telefon raqami yo‘q edi, shuning uchun u ertasi kuni politsiya bo‘limiga keldi.","U Ravshan bilan uchrashdi va unga sovg‘a berdi — yangi qo‘l soati. Ravshan uni oldimi? «Ha, oldim, — dedi u. — Endi doim soat necha bo‘lganini bilaman!»"],"tf":[["Ravshan found the bag two weeks ago.",true],["There was a phone in the bag.",false],["Ravshan kept the bag.",false],["The owner was from Japan.",true]],"mcq":[["Where did Ravshan go with the bag?",["to the police","to a hotel","to the airport"]],["What was the present?",["a new watch","money","a laptop"]],["When did the businessman come to the police station?",["the next day","two weeks later","the same day"]]],"find":[["topdi","found"],["yo‘lovchi","passenger"],["sovg‘a","present"],["oldin (two weeks …)","ago"]]},"grammar":[{"name":"Past simple — regular verbs (-ed)","note":"fe’l + <b>-ed</b>: work → work<b>ed</b>. -e bilan tugasa + <b>d</b>: live → live<b>d</b>. undosh + y → <b>-ied</b>: study → stud<b>ied</b>. Qisqa fe’l (unli+undosh) → undosh ikkilanadi: stop → sto<b>pped</b>.","form":[["play → ___","played"],["move → ___","moved"],["study → ___","studied"],["stop → ___","stopped"],["try → ___","tried"]],"choose":[["Men kecha futbol o‘ynadim.",["I played football yesterday.","I play football yesterday.","I plaied football yesterday."]],["U 2015-yilda universitetni tugatdi.",["She finished university in 2015.","She finish university in 2015.","She was finished university in 2015."]]]},{"name":"Past simple — negatives & questions","note":"Inkor: <b>didn’t</b> verbs (quickly, well…) · requests & offers · verb + noun · opposite adjectives · the smartphone · everyday problems","vocab":[["swim","suzmoq"],["sing","qo‘shiq aytmoq"],["dance","raqsga tushmoq"],["draw","rasm chizmoq"],["paint","bo‘yoq bilan chizmoq"],["drive","mashina haydamoq"],["ride a bike","velosiped haydamoq"],["speak","gapirmoq"],["cook","ovqat pishirmoq"],["play the piano","pianino chalmoq"],["play chess","shaxmat o‘ynamoq"],["well","yaxshi"],["badly","yomon"],["quickly","tez"],["slowly","sekin"],["travel","sayohat qilmoq"],["take photos","suratga olmoq"],["shop online","internetdan xarid qilmoq"],["play video games","video o‘yin o‘ynamoq"],["listen to music","musiqa tinglamoq"],["go to the cinema","kinoga bormoq"],["go out with friends","do‘stlar bilan sayr qilmoq"],["work in the garden","bog‘da ishlamoq"],["read","kitob o‘qimoq"],["love","juda yaxshi ko‘rmoq"],["hate","yomon ko‘rmoq"],["don’t mind","qarshi emasman"],["hobby","sevimli mashg‘ulot"],["Can you help me?","Menga yordam bera olasizmi?"],["Of course","Albatta"]],"reading":{"title":"Bekzod can paint — a young artist from Nukus","text":["Bekzod is fourteen and he lives in Nukus. He can’t play football very well and he can’t swim, but he can paint beautifully. His paintings are in a small gallery in his city.","He loves painting animals and old buildings. He paints slowly and carefully — one picture takes two or three weeks. He also likes taking photos and he can play the dutar.","‘I don’t like playing video games,’ he says. ‘I like going out with my camera. My dream is to paint all the old cities of Uzbekistan.’ Can he do it? We think he can!"],"gloss":{"paintings":"rasmlar (bo‘yoqli)","gallery":"galereya","animals":"hayvonlar","carefully":"ehtiyotkorlik bilan","dream":"orzu"},"uz":["Bekzod o‘n to‘rt yoshda va Nukusda yashaydi. U futbolni unchalik yaxshi o‘ynay olmaydi va suza olmaydi, lekin chiroyli rasm chiza oladi. Uning rasmlari shahridagi kichik galereyada turibdi.","U hayvonlar va eski binolarni chizishni juda yaxshi ko‘radi. U sekin va ehtiyotkorlik bilan chizadi — bitta rasm ikki-uch hafta vaqt oladi. U suratga olishni ham yoqtiradi va dutor chala oladi.","«Men video o‘yin o‘ynashni yoqtirmayman, — deydi u. — Fotoapparatim bilan sayr qilishni yoqtiraman. Orzuim — O‘zbekistonning barcha qadimiy shaharlarini chizish». U buni uddalay oladimi? Bizningcha, ha!"],"tf":[["Bekzod can swim very well.",false],["He can paint beautifully.",true],["He paints quickly.",false],["He doesn’t like playing video games.",true]],"mcq":[["What does Bekzod love painting?",["animals and old buildings","people","cars"]],["How long does one picture take?",["two or three weeks","one day","two months"]],["What musical instrument can he play?",["the dutar","the piano","the guitar"]]],"find":[["sekin","slowly"],["orzu","dream"],["chiroyli (ravish)","beautifully"],["suratga olish","taking photos"]]},"grammar":[{"name":"can / can’t","note":"<b>can</b> + fe’l — qila olaman. <b>can’t</b> + fe’l — qila olmayman. Hamma shaxsga bir xil: She <b>can swim</b> (✗ cans, ✗ can to swim). Savol: <b>Can</b> you <b>drive</b>? — Yes, I <b>can</b>. / No, I <b>can’t</b>.","form":[["Men suza olaman: I ___ swim.","can"],["U qo‘shiq ayta olmaydi: She ___ sing.","can't|cannot|can not"],["___ you play chess?","can"],["Can he drive? — No, he ___.","can't|cannot"],["Iltimos: ___ you help me?","can"]],"choose":[["U uchta tilda gapira oladi.",["He can speak three languages.","He cans speak three languages.","He can to speak three languages."]],["Siz raqsga tusha olasizmi?",["Can you dance?","Do you can dance?","You can dance?"]]]},{"name":"like + -ing · adverbs of manner","note":"<b>like / love / hate / don’t mind</b> + fe’l<b>-ing</b>: I <b>like reading</b>. swim → swi<b>mming</b>, dance → danc<b>ing</b>. Ravish: sifat + <b>-ly</b> (slow → slow<b>ly</b>, quick → quick<b>ly</b>), lekin good → <b>well</b>.","form":[["I like ___ (read).","reading"],["She loves ___ (dance).","dancing"],["They hate ___ (swim).","swimming"],["quick → ___","quickly"],["good → ___","well"]],"choose":[["Men kino ko‘rishni yaxshi ko‘raman.",["I love watching films.","I love watch films.","I love to watching films."]],["U yaxshi pishiradi.",["He cooks well.","He cooks good.","He cooks goodly."]]]}],"build":[["I can't swim very well","Men unchalik yaxshi suza olmayman."],["She likes taking photos","U suratga olishni yoqtiradi."],["Can you help me please","Menga yordam bera olasizmi, iltimos?"]],"writing":{"title":"Ijtimoiy tarmoqqa post yozing (social media post)","errors":{"text":"I *can to play the piano. I like *read books and I *loves cooking. I can't sing *good.","fixed":"I can play the piano. I like reading books and I love cooking. I can't sing well."},"modelTitle":"Post: Find a hobby friend!","model":["Hi everyone! I’m Shahlo from Termez 👋","I love cooking and I like taking photos of food.","I can cook plov and samsa, but I can’t make cakes 😅","I don’t like playing video games.","Can anyone teach me to make a cake? I can teach you to cook plov!"],"task":"O‘zingizning qiziqishlaringiz haqida 4–6 gapli post yozing: nima qila olasiz, nima qila olmaysiz, nimani yoqtirasiz.","min":4,"max":6,"checks":[["Kamida 4 ta gap",""],["can","\\bcan\\b"],["can’t","(can't|can’t|cannot)"],["like / love / hate + -ing","\\b(like|likes|love|loves|hate|hates|mind) \\w+ing\\b"]]}},{"n":12,"title":"Thank you very much!","uz":"Katta rahmat!","topics":"would like · some and any · like and would like · places in town · in a café (kafeda) · birthdays · offering food and drink","vocab":[["coffee","qahva"],["tea","choy"],["water","suv"],["orange juice","apelsin sharbati"],["cake","tort, pirojniy"],["sandwich","sendvich"],["salad","salat"],["soup","sho‘rva"],["ice cream","muzqaymoq"],["menu","menyu"],["bill","hisob"],["I’d like…","Menga … bering / …ni xohlayman"],["Would you like…?","…ni xohlaysizmi?"],["invitation","taklifnoma"],["party","bazm, ziyofat"],["Thank you for…","… uchun rahmat"],["Can you come?","Kela olasizmi?"],["delicious","mazali"],["popular","mashhur, ommabop"],["birthday","tug‘ilgan kun"],["present","sovg‘a"],["flowers","gullar"],["chocolates","shokoladlar"],["some","biroz, bir nechta"],["any","hech qanday (savol/inkor)"],["Here you are","Mana, oling"]],"reading":{"title":"Birthday in a café — Lola’s day","text":["It’s Lola’s birthday today. She’s twenty. Her friends Dilnoza and Kamron take her to a nice café in the city centre. The waiter comes to their table. ‘Hello! What would you like?’","‘I’d like a hot chocolate and some cake, please,’ says Lola. ‘Would you like some ice cream too?’ asks Kamron. ‘No, thanks. I don’t want any ice cream — it’s cold today!’ Dilnoza would like a coffee and a sandwich.","After lunch, her friends give her some presents: flowers, a book and a beautiful scarf. ‘Thank you very much!’ says Lola. ‘I love them! I’d like to come here every birthday!’"],"gloss":{"city centre":"shahar markazi","table":"stol","After":"…dan keyin","give":"bermoq","scarf":"sharf, ro‘mol"},"uz":["Bugun Lolaning tug‘ilgan kuni. U yigirma yoshda. Do‘stlari Dilnoza va Kamron uni shahar markazidagi yaxshi kafega olib borishadi. Ofitsiant ularning stoliga keladi: «Salom! Nima xohlaysiz?»","«Menga issiq shokolad va pirojniy bering, iltimos», — deydi Lola. «Muzqaymoq ham xohlaysanmi?» — so‘raydi Kamron. «Yo‘q, rahmat. Muzqaymoq xohlamayman — bugun sovuq!» Dilnoza qahva va sendvich xohlaydi.","Tushlikdan keyin do‘stlari unga sovg‘alar berishadi: gullar, kitob va chiroyli sharf. «Katta rahmat! — deydi Lola. — Menga juda yoqdi! Har tug‘ilgan kunda shu yerga kelgim keladi!»"],"tf":[["Lola is twenty today.",true],["Lola would like some ice cream.",false],["Dilnoza would like a coffee and a sandwich.",true],["Her friends give her a phone.",false]],"mcq":[["What would Lola like?",["a hot chocolate and some cake","a coffee and a sandwich","ice cream"]],["Why doesn’t she want ice cream?",["It’s cold today.","She doesn’t like it.","It’s expensive."]],["What presents does Lola get?",["flowers, a book and a scarf","chocolates and a bag","a cake"]]],"find":[["tug‘ilgan kun","birthday"],["sovg‘alar","presents"],["gullar","flowers"],["ofitsiant","waiter"]]},"grammar":[{"name":"would like + noun / to + verb","note":"Muloyim istak: I’<b>d like</b> a coffee (menga qahva bering). I’<b>d like to</b> go (bormoqchiman). Taklif: <b>Would you like</b> some tea? — Yes, please. / No, thank you. ✗ I’d like <s>go</s>.","form":[["Menga choy bering: I’___ like a tea.","d"],["Men kafe ochmoqchiman: I’d like ___ open a café.","to"],["___ you like some cake?","would"],["She’d like ___ (learn) French.","to learn"],["Would you like a sandwich? — Yes, ___.","please"]],"choose":[["Menga apelsin sharbati bering, iltimos.",["I’d like an orange juice, please.","I like an orange juice, please.","I’d like to an orange juice, please."]],["Muzqaymoq xohlaysizmi?",["Would you like an ice cream?","Do you like an ice cream now?","Would you like to an ice cream?"]]]},{"name":"Countable / uncountable · some / any","note":"Sanaladigan: an egg, two carrots. Sanalmaydigan: rice, water, oil (ko‘plik yo‘q, a/an yo‘q). <b>some</b> — darak gapda, <b>any</b> — inkor va savolda: There’s <b>some</b> milk. There aren’t <b>any</b> eggs. Is there <b>any</b> salt?","form":[["There’s ___ rice in the kitchen. (+)","some"],["We don’t have ___ onions. (–)","any"],["Are there ___ tomatoes? (?)","any"],["I need ___ egg. (a / an)","an"],["Can I have ___ water, please? (some / any)","some"]],"choose":[["Bizda umuman shakar yo‘q.",["We don’t have any sugar.","We don’t have some sugar.","We don’t have a sugar."]],["Qaysi so‘z sanalmaydi?",["flour","carrot","plate"]]]}],"build":[["I'd like a hot chocolate please","Menga issiq shokolad bering, iltimos."],["Would you like some cake","Pirojniy xohlaysizmi?"],["Thank you very much","Katta rahmat."]],"writing":{"title":"Tug‘ilgan kunga taklifnoma yoki rahmat xati","errors":{"text":"Hi Nodir! I *going to have a party on Friday. *Would you like come? We're going *eat plov. Thank you *to the present!","fixed":"Hi Nodir! I'm going to have a party on Friday. Would you like to come? We're going to eat plov. Thank you for the present!"},"modelTitle":"Invitation","model":["Dear Kamila,","I’m going to have a birthday party on Saturday at 6 p.m.","It’s going to be at my house — Navoi Street, 12.","We’re going to have a big cake and play games.","Would you like to come? Please text me.","Love, Sabina"],"task":"Do‘stingizni bazmga taklif qiluvchi 4–6 gapli taklifnoma yozing (yoki sovg‘a uchun rahmat xati): qachon, qayerda, nima qilasizlar.","min":4,"max":6,"checks":[["Kamida 4 ta gap",""],["going to","going to"],["Would you like … ? / I’d like …","(would you like|i'd like|i’d like|i would like)"],["Murojaat (Dear / Hi …)","\\b(dear|hi|hello)\\b"]]}},{"n":13,"title":"What’s happening now?","uz":"Hozir nima bo‘lyapti?","topics":"Present Continuous · Present Simple and Present Continuous · colours & clothes (ranglar, kiyimlar) · opposite verbs · What’s the matter?","vocab":[["red","qizil"],["blue","ko‘k"],["green","yashil"],["yellow","sariq"],["black","qora"],["white","oq"],["brown","jigarrang"],["grey","kulrang"],["shirt","ko‘ylak"],["T-shirt","futbolka"],["dress","ko‘ylak (ayollar)"],["jeans","jinsi shim"],["shoes","tufli"],["jacket","kurtka"],["hat","shlyapa, bosh kiyim"],["coat","palto"],["skirt","yubka"],["trainers","krossovka"],["buy","sotib olmoq"],["sell","sotmoq"],["open","ochmoq"],["close","yopmoq"],["start","boshlamoq"],["finish","tugatmoq"],["What’s the matter?","Nima bo‘ldi?"],["I’m tired","Charchadim"],["I’m hungry","Qornim och"]],"reading":{"title":"Shopping at Chorsu — a message from Nilufar","text":["Hi Kate! I’m writing to you from Chorsu Bazaar in Tashkent. It’s Saturday and the bazaar is very crowded. Right now I’m sitting in a small café and I’m drinking green tea. My mum is buying spices and my brother is looking at old watches.","You can buy almost everything here: fruit, bread, clothes, shoes and beautiful bags. The prices are cheap, but you can’t pay by card everywhere — a lot of sellers only take cash. And you can usually get a discount if you ask politely!","I usually buy my clothes online, but today I’m wearing a new scarf from the bazaar. It’s red and blue and it was very cheap. When you come to Tashkent, we can go there together!"],"gloss":{"crowded":"odam gavjum","spices":"ziravorlar","almost":"deyarli","sellers":"sotuvchilar","politely":"xushmuomalalik bilan"},"uz":["Salom, Keyt! Senga Toshkentdagi Chorsu bozoridan yozyapman. Bugun shanba va bozor juda gavjum. Hozir men kichik kafeda o‘tirib, ko‘k choy ichyapman. Onam ziravor sotib olyapti, akam esa eski soatlarga qarayapti.","Bu yerda deyarli hamma narsani sotib olsa bo‘ladi: meva, non, kiyim, oyoq kiyim va chiroyli sumkalar. Narxlar arzon, lekin hamma joyda karta bilan to‘lab bo‘lmaydi — ko‘p sotuvchilar faqat naqd pul oladi. Xushmuomalalik bilan so‘rasang, odatda chegirma ham olsa bo‘ladi!","Men odatda kiyimlarimni internetdan olaman, lekin bugun bozordan olgan yangi sharfimni taqib turibman. U qizil-ko‘k va juda arzon bo‘ldi. Toshkentga kelganingda, u yerga birga boramiz!"],"tf":[["Nilufar is at the bazaar on Saturday.",true],["Her brother is buying spices.",false],["You can pay by card everywhere at the bazaar.",false],["Nilufar usually buys clothes online.",true]],"mcq":[["What is Nilufar doing right now?",["drinking green tea in a café","buying a scarf","looking at watches"]],["How can you get a discount?",["ask politely","pay by card","buy online"]],["What is Nilufar wearing today?",["a new scarf","a new dress","new trainers"]]],"find":[["arzon","cheap"],["chegirma","discount"],["naqd pul","cash"],["kiyib yurmoq (-ing shakli)","wearing"]]},"grammar":[{"name":"Present Continuous (am / is / are + -ing)","note":"Hozir bo‘layotgan ish: I’<b>m wearing</b> · she’<b>s reading</b> · they’<b>re playing</b>. Imlo: make → mak<b>ing</b>, sit → si<b>tting</b>, run → ru<b>nning</b>. Inkor: I’<b>m not</b> working. Savol: <b>Are</b> you <b>listening</b>?","form":[["I ___ (read) a book now.","am reading|'m reading"],["She ___ (wear) a red dress.","is wearing|'s wearing"],["They ___ (play) football.","are playing|'re playing"],["sit → ___","sitting"],["___ you listening? — Yes, I am.","are"]],"choose":[["U hozir televizor ko‘ryapti.",["He’s watching TV now.","He watching TV now.","He’s watch TV now."]],["Nima qilyapsiz?",["What are you doing?","What do you doing?","What you are doing?"]]]},{"name":"Present continuous vs present simple","note":"Hozir sodir bo‘layotgan ish: am/is/are + fe’l<b>-ing</b> (I’<b>m wearing</b> a scarf <b>now</b>). Odat/doimiy ish: present simple (I usually <b>wear</b> jeans). Imlo: make → mak<b>ing</b>, sit → si<b>tting</b>.","form":[["She ___ (buy) a dress now.","is buying|'s buying"],["We ___ (sit) in a café at the moment.","are sitting|'re sitting"],["I ___ (not / wear) a coat today.","am not wearing|'m not wearing"],["He usually ___ (wear) a suit to work.","wears"],["___ you looking for a jacket?","are"]],"choose":[["Qarang! U yangi kurtka kiyib olibdi.",["Look! He’s wearing a new jacket.","Look! He wears a new jacket.","Look! He wearing a new jacket."]],["Men odatda internetdan xarid qilaman.",["I usually shop online.","I’m usually shopping online.","I usually shopping online."]],["Qaysi gap noto‘g‘ri?",["I’m knowing the price.","She’s trying on a skirt.","They often buy shoes online."]]]}],"build":[["What are you doing now","Hozir nima qilyapsiz?"],["She is wearing a blue coat","U ko‘k palto kiyib olgan."],["They aren't working today","Ular bugun ishlamayapti."]],"writing":{"title":"Suratingiz haqida yozing (a photo)","errors":{"text":"In this photo I *wearing a white shirt. My brother *is play the guitar. My parents *is sitting in the garden.","fixed":"In this photo I'm wearing a white shirt. My brother is playing the guitar. My parents are sitting in the garden."},"modelTitle":"My favourite photo","model":["This is a photo of my family at my sister’s wedding.","My sister is wearing a beautiful white dress.","My father is talking to the guests and my mother is smiling.","My little brother is eating cake — he loves cake!","I’m taking the photo, so I’m not in it."],"task":"Sevimli suratingizni tasvirlang (4–6 gap): suratda kim bor, nima kiyib olgan, nima qilyapti.","min":4,"max":6,"checks":[["Kamida 4 ta gap",""],["Present Continuous (am/is/are + -ing)","\\b(am|is|are|'m|’m|'s|’s|'re|’re) \\w+ing\\b"],["Kiyim yoki rang so‘zi","\\b(red|blue|green|yellow|black|white|brown|grey|shirt|t-shirt|dress|jeans|shoes|jacket|hat|coat|skirt|trainers)\\b"],["in this photo / this is","(photo|this is)"]]}},{"n":14,"title":"Let’s go!","uz":"Ketdik!","topics":"future plans: going to · Present Continuous for future · grammar revision · forms of transport · social expressions","vocab":[["plan","reja"],["project","loyiha"],["next week","kelasi hafta"],["next year","kelasi yil"],["tomorrow","ertaga"],["tonight","bugun kechqurun"],["move to","…ga ko‘chmoq"],["learn","o‘rganmoq"],["start a business","biznes boshlamoq"],["invitation","taklifnoma"],["party","bazm, ziyofat"],["Can you come?","Kela olasizmi?"],["bus","avtobus"],["train","poyezd"],["plane","samolyot"],["taxi","taksi"],["bike","velosiped"],["boat","qayiq, kema"],["metro","metro"],["on foot","piyoda"],["by car","mashinada"],["airport","aeroport"],["station","vokzal"],["Have a good trip!","Oq yo‘l!"],["Good luck!","Omad!"],["Congratulations!","Tabriklayman!"]],"reading":{"title":"A new life — Madina’s plans","text":["Madina is a nurse in Urgench. But next year her life is going to change. She’s going to move to Tashkent with her husband, Otabek. He’s going to start a new job in a big hospital.","Madina isn’t going to work as a nurse in Tashkent. She’s going to open a small café! ‘I love cooking,’ she says. ‘I’d like to make Khorezm food for people in the capital — tukhum barak, shivit oshi and sweet cakes.’","Are they going to sell their house in Urgench? ‘No, we aren’t,’ says Otabek. ‘Our parents are going to live there. We’re going to visit them every summer.’"],"gloss":{"change":"o‘zgarmoq","open":"ochmoq","capital":"poytaxt","sell":"sotmoq","visit":"ziyorat qilmoq, borib kelmoq"},"uz":["Madina Urganchda hamshira bo‘lib ishlaydi. Lekin kelasi yil uning hayoti o‘zgaradi. U eri Otabek bilan Toshkentga ko‘chib o‘tadi. Otabek katta shifoxonada yangi ishni boshlaydi.","Madina Toshkentda hamshira bo‘lib ishlamaydi. U kichik kafe ochmoqchi! «Men ovqat pishirishni juda yaxshi ko‘raman, — deydi u. — Poytaxtdagi odamlar uchun Xorazm taomlarini — tuxum barak, shivit oshi va shirin pishiriqlarni tayyorlamoqchiman».","Ular Urganchdagi uylarini sotishadimi? «Yo‘q, — deydi Otabek. — U yerda ota-onalarimiz yashaydi. Biz ularni har yozda borib ko‘ramiz»."],"tf":[["Madina is going to move to Tashkent.",true],["She is going to work as a nurse in Tashkent.",false],["Otabek is going to start a new job.",true],["They are going to sell their house.",false]],"mcq":[["What is Madina going to open?",["a small café","a hospital","a shop"]],["What food would she like to make?",["Khorezm food","Italian food","only cakes"]],["Who is going to live in their house in Urgench?",["their parents","their friends","nobody"]]],"find":[["kelasi yil","next year"],["ochmoq","open"],["poytaxt","capital"],["sotmoq","sell"]]},"grammar":[{"name":"going to (rejalar)","note":"am/is/are + <b>going to</b> + fe’l: I’<b>m going to learn</b> English. Inkor: She <b>isn’t going to</b> work. Savol: <b>Are</b> you <b>going to</b> move? — Yes, I <b>am</b>. / No, I’<b>m not</b>.","form":[["I ___ going to visit my aunt.","am|'m"],["He ___ going to buy a car.","is|'s"],["We ___ going to sell our house. (–)","aren't|are not|'re not"],["___ they going to come?","are"],["She’s going ___ start a business.","to"]],"choose":[["Kelasi hafta men Samarqandga boraman (reja).",["I’m going to go to Samarkand next week.","I going to go to Samarkand next week.","I’m go to Samarkand next week."]],["Siz ingliz tilini o‘rganmoqchimisiz?",["Are you going to learn English?","Do you going to learn English?","Are you going learn English?"]]]},{"name":"Present Continuous for future · by + transport","note":"Aniq belgilangan reja: I’<b>m flying</b> to Istanbul <b>on Monday</b>. We’<b>re meeting</b> at 6 <b>tomorrow</b>. Transport: <b>by</b> bus / train / plane / car, lekin <b>on foot</b> (piyoda).","form":[["I ___ (fly) to London tomorrow.","am flying|'m flying"],["We ___ (meet) Ali tonight.","are meeting|'re meeting"],["She’s going to work ___ bus.","by"],["I walk to school — I go ___ foot.","on"],["___ you coming to the party on Friday?","are"]],"choose":[["Ertaga poyezdda Buxoroga ketyapman.",["I’m going to Bukhara by train tomorrow.","I go to Bukhara with train tomorrow.","I’m going to Bukhara on train tomorrow."]],["Biz shanba kuni ularni ko‘rgani boryapmiz.",["We’re visiting them on Saturday.","We visiting them on Saturday.","We’re visit them on Saturday."]]]}],"build":[["We are going to travel by train","Biz poyezdda sayohat qilamiz."],["I'm flying to Istanbul on Monday","Dushanba kuni Istanbulga uchyapman."],["Have a good trip","Oq yo‘l!"]],"writing":{"title":"Kelajakdagi rejalaringiz haqida yozing","errors":{"text":"Next summer I'm going *travel to Turkey. We *going to fly from Tashkent. We're going to stay *on a hotel near the sea.","fixed":"Next summer I'm going to travel to Turkey. We're going to fly from Tashkent. We're going to stay in a hotel near the sea."},"modelTitle":"My plans for next year","model":["Next year is going to be a big year for me!","I’m going to finish school in June.","In September I’m going to study English in Tashkent.","I’m going to go there by train every week.","This summer I’m going to visit my grandparents in Nukus."],"task":"Kelasi yil (yoki ta’til) rejalaringiz haqida 4–6 gap yozing: nima qilasiz, qayerga borasiz, qanday transportda.","min":4,"max":6,"checks":[["Kamida 4 ta gap",""],["going to","going to"],["Transport (by bus, by train, on foot…)","(by (bus|train|plane|car|taxi|bike|boat|metro)|on foot|fly)"],["Vaqt (next year, tomorrow, in June…)","\\b(next|tomorrow|tonight|on (monday|tuesday|wednesday|thursday|friday|saturday|sunday)|in (january|february|march|april|may|june|july|august|september|october|november|december))\\b"]]}}];

<script>
(function(){
var COLORS=["#2f6fdb","#6c4bd1","#0f8a6a","#c4581a","#c43a6a","#2b8bb8","#7a5a12","#4b6b1f","#b8332b","#5446c9","#0b7a8c","#8a3fb0"];
var KEY="headwayBhw";
var S=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S.items=S.items||{};S.texts=S.texts||{};S.done=S.done||{};
var $=function(s,r){return (r||document).querySelector(s)};
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/\s+/g," ").replace(/[.!?]+$/,"").trim()}
function shuffle(a,seed){a=a.slice();var x=seed||Math.random()*1e9|0;for(var i=a.length-1;i>0;i--){x=(x*9301+49297)%233280;var j=Math.floor(x/233280*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function hash(s){var h=7;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%100000;return h}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on")},1800)}
function speak(txt){try{var u=new SpeechSynthesisUtterance(txt);u.lang="en-GB";u.rate=.9;var v=speechSynthesis.getVoices().filter(function(v){return /^en(-|_)GB/i.test(v.lang)})[0]||speechSynthesis.getVoices().filter(function(v){return /^en/i.test(v.lang)})[0];if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
if(window.speechSynthesis)speechSynthesis.getVoices();

/* --- task registry: every task has id and item count; done when all items solved --- */
function itemKey(t,i){return t+"#"+i}
function solved(t,i){return !!S.items[itemKey(t,i)]}
function mark(t,i,first){var k=itemKey(t,i);if(!S.items[k]){S.items[k]=first?2:1;save()}}
function prep(u){if(u.pick)return;var ix=shuffle(u.vocab.map(function(_,k){return k}),hash("p"+u.n));u.pick=ix.slice(0,6);u.spell=ix.slice(6).filter(function(k){return u.vocab[k][0].split(" ").length<=2}).slice(0,5)}
function tasksOf(u){prep(u);var L=[];var n=u.n;
 L.push(["u"+n+"-match",u.vocab.length]);
 L.push(["u"+n+"-pick",u.pick.length]);
 L.push(["u"+n+"-spell",u.spell.length]);
 L.push(["u"+n+"-tf",u.reading.tf.length]);
 L.push(["u"+n+"-mcq",u.reading.mcq.length]);
 L.push(["u"+n+"-find",u.reading.find.length]);
 u.grammar.forEach(function(g,gi){L.push(["u"+n+"-g"+gi,g.form.length+g.choose.length])});
 L.push(["u"+n+"-build",u.build.length]);
 L.push(["u"+n+"-err",1]);
 L.push(["u"+n+"-write",1]);
 return L}
function taskDone(id,cnt){for(var i=0;i<cnt;i++)if(!solved(id,i))return false;return true}
function unitStat(u){var L=tasksOf(u),d=0;L.forEach(function(t){if(taskDone(t[0],t[1]))d++});return [d,L.length]}
function unitScore(u){var L=tasksOf(u),ok=0,all=0;L.forEach(function(t){if(/write$/.test(t[0]))return;for(var i=0;i<t[1];i++){all++;if(S.items[itemKey(t[0],i)]===2)ok++}});return [ok,all]}
function allStat(){var d=0,a=0;UNITS.forEach(function(u){var s=unitStat(u);d+=s[0];a+=s[1]});return [d,a]}

/* ---------- header / footer ---------- */
function byline(){if(!CONFIG.author&&!CONFIG.telegram)return "";var s="Tuzuvchi: "+esc(CONFIG.author||"");if(CONFIG.telegram)s+=(CONFIG.author?" · ":"")+'<a href="https://t.me/'+esc(CONFIG.telegram)+'" target="_blank" rel="noopener">@'+esc(CONFIG.telegram)+"</a>";return s}
function footer(){$("#ft").innerHTML=(byline()?byline()+" · ":"")+"«"+esc(CONFIG.book)+"» asosida"}

/* ---------- HOME ---------- */
function home(){
 document.documentElement.style.setProperty("--acc",COLORS[0]);
 $("#hd").innerHTML='<h1>Ingliz tili · Uy vazifasi <small>Homework</small></h1><p>'+esc(CONFIG.book)+' · '+UNITS.length+' unit (1–'+UNITS.length+') · Lug‘at, o‘qish, grammatika va yozuv</p>'+(byline()?'<p class="by">'+byline()+'</p>':"");
 var app=$("#app");app.innerHTML="";
 var c=el("div","card");var st=allStat();
 c.innerHTML='<label class="lbl" for="nm">Ismingiz / Your name</label><input type="text" id="nm" placeholder="Ismingizni yozing"><div class="bar"><i style="width:'+(st[1]?st[0]/st[1]*100:0)+'%"></i></div><div class="small">Umumiy natija: '+st[0]+' / '+st[1]+' topshiriq</div>';
 app.appendChild(c);
 var nm=$("#nm");nm.value=S.name||"";nm.oninput=function(){S.name=nm.value;save()};
 UNITS.forEach(function(u,i){
  var s=unitStat(u);var b=el("button","unit");b.style.setProperty("--c",COLORS[i%COLORS.length]);
  b.innerHTML='<div class="tag">'+u.n+'-UNIT · Unit '+u.n+'</div><h2>'+esc(u.title)+' <span>'+esc(u.uz)+'</span></h2><div class="tp">'+esc(u.topics)+'</div><div class="bar"><i style="width:'+(s[0]/s[1]*100)+'%"></i></div><div class="small">'+s[0]+' / '+s[1]+' topshiriq bajarildi</div>';
  b.onclick=function(){location.hash="#u"+u.n+"-vocab"};app.appendChild(b)});
 footer();window.scrollTo(0,0)}

/* ---------- UNIT ---------- */
var TABS=[["vocab","Lug‘at"],["reading","O‘qish"],["grammar","Grammatika"],["writing","Yozuv"]];
var CUR=null;
function unitHeader(u){var s=unitStat(u);var i=UNITS.indexOf(u);
 var nx=UNITS[i+1];
 $("#hd").innerHTML='<div class="topbtns"><button class="pill" id="bk">← Barcha unitlar</button>'+(nx?'<button class="pill" id="nx">'+nx.n+'-unit ›</button>':"")+'</div><h1>'+u.n+'-unit · '+esc(u.title)+' <small>'+esc(u.uz)+'</small></h1><p id="ust">'+s[0]+' / '+s[1]+' topshiriq bajarildi</p>';
 $("#bk").onclick=function(){location.hash=""};if(nx)$("#nx").onclick=function(){location.hash="#u"+nx.n+"-vocab"}}
function refresh(){if(!CUR)return;var s=unitStat(CUR);var e=$("#ust");if(e)e.textContent=s[0]+" / "+s[1]+" topshiriq bajarildi"}
function unit(u,tab){
 CUR=u;document.documentElement.style.setProperty("--acc",COLORS[(u.n-1)%COLORS.length]);
 unitHeader(u);var app=$("#app");app.innerHTML="";
 var t=el("div","tabs");TABS.forEach(function(x){var b=el("button","tab"+(x[0]===tab?" on":""),x[1]);b.onclick=function(){location.hash="#u"+u.n+"-"+x[0]};t.appendChild(b)});
 app.appendChild(t);
 ({vocab:vocab,reading:reading,grammar:grammar,writing:writing})[tab](u,app);
 var ti=TABS.findIndex(function(x){return x[0]===tab});var nb;
 if(ti<3){nb=el("button","btn next","Keyingisi: "+TABS[ti+1][1]+" →");nb.onclick=function(){location.hash="#u"+u.n+"-"+TABS[ti+1][0]}}
 else{var nx=UNITS[UNITS.indexOf(u)+1];nb=el("button","btn next",nx?"Keyingi unit: "+nx.n+"-unit →":"← Barcha unitlar");nb.onclick=function(){location.hash=nx?"#u"+nx.n+"-vocab":""}}
 app.appendChild(nb);footer();window.scrollTo(0,0)}

/* ---- generic question builders ---- */
function card(title,hint){var c=el("div","card");c.innerHTML="<h3>"+title+"</h3>"+(hint?'<div class="hint">'+hint+"</div>":"");return c}
function qrow(c,i,label){var q=el("div","q");q.innerHTML='<div class="qt"><span class="n">'+(i+1)+"</span>"+label+"</div>";c.appendChild(q);return q}
function choiceQ(c,tid,i,label,opts,ans,row){
 var q=qrow(c,i,label);var box=el("div","opts"+(row?" row":""));var tried=false;
 var order=row?opts.map(function(_,k){return k}):shuffle(opts.map(function(_,k){return k}),hash(tid+i));
 order.forEach(function(k){var b=el("button","opt",esc(opts[k]));
  if(solved(tid,i)&&k===ans)b.classList.add("ok");
  b.onclick=function(){if(solved(tid,i))return;
   if(k===ans){b.classList.add("ok");mark(tid,i,!tried);refresh()}else{tried=true;b.classList.add("bad")}};
  box.appendChild(b)});
 q.appendChild(box)}
function inputQ(c,tid,i,label,answers){
 var q=qrow(c,i,label);var row=el("div","in");var inp=el("input");inp.type="text";inp.placeholder="Javob";inp.setAttribute("aria-label","Javob");inp.autocomplete="off";inp.spellcheck=false;
 var ch=el("button","btn","Tekshirish"),hp=el("button","btn ghost","Yordam");var fb=el("div","fb");var tried=false;
 var A=answers.split("|");var k=itemKey(tid,i);
 if(solved(tid,i)){inp.value=S.texts[k]||A[0];inp.classList.add("ok")}
 function check(){var v=norm(inp.value);if(!v)return;
  if(A.some(function(a){return norm(a)===v})){inp.classList.remove("bad");inp.classList.add("ok");fb.className="fb ok";fb.textContent="To‘g‘ri! ✓";S.texts[k]=inp.value;mark(tid,i,!tried);refresh()}
  else{tried=true;inp.classList.add("bad");fb.className="fb bad";fb.textContent="Yana urinib ko‘ring."}}
 ch.onclick=check;inp.onkeydown=function(e){if(e.key==="Enter")check()};
 hp.onclick=function(){tried=true;var a=A[0];var cur=inp.value;var n=0;while(n<cur.length&&n<a.length&&cur[n].toLowerCase()===a[n].toLowerCase())n++;inp.value=a.slice(0,n+1);fb.className="fb";fb.textContent="Maslahat: "+a.length+" ta belgi";inp.focus()};
 row.appendChild(inp);row.appendChild(ch);row.appendChild(hp);q.appendChild(row);q.appendChild(fb)}

/* ---------- VOCAB ---------- */
function vocab(u,app){
 var c=card("So‘zlar banki","So‘zni bosing – talaffuzini eshitasiz.");var bk=el("div","bank");
 u.vocab.forEach(function(w){var b=el("button","w","<b>"+esc(w[0])+"</b><span>"+esc(w[1])+"</span>");b.onclick=function(){speak(w[0])};bk.appendChild(b)});
 c.appendChild(bk);app.appendChild(c);
 // matching
 var tid="u"+u.n+"-match";var m=card("So‘z va ma’nosini juftlang","Chapdan inglizcha so‘zni, o‘ngdan uning ma’nosini bosing.");
 var idx=u.vocab.map(function(_,k){return k});var per=6;var stages=Math.ceil(idx.length/per);
 m.querySelector(".hint").textContent+=" "+stages+" bosqich.";
 for(var s=0;s<stages;s++)(function(s){
  var part=idx.slice(s*per,s*per+per);m.appendChild(el("div","stage",(s+1)+"-bosqich / "+stages));
  var g=el("div","match"),L=el("div"),R=el("div");var sel=null;
  shuffle(part,hash(tid+s)).forEach(function(k){var b=el("button","mb",esc(u.vocab[k][0]));b.dataset.k=k;if(solved(tid,k))b.classList.add("ok");
   b.onclick=function(){if(b.classList.contains("ok"))return;L.querySelectorAll(".sel").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");sel=b;speak(u.vocab[k][0])};L.appendChild(b)});
  shuffle(part,hash(tid+s+"r")).forEach(function(k){var b=el("button","mb",esc(u.vocab[k][1]));b.dataset.k=k;if(solved(tid,k))b.classList.add("ok");
   b.onclick=function(){if(b.classList.contains("ok")||!sel)return;
    if(sel.dataset.k==k){sel.classList.remove("sel");sel.classList.add("ok");b.classList.add("ok");mark(tid,k,!sel._bad);sel=null;refresh()}
    else{sel._bad=true;b.classList.add("bad");setTimeout(function(){b.classList.remove("bad")},400)}};R.appendChild(b)});
  g.appendChild(L);g.appendChild(R);m.appendChild(g)})(s);
 app.appendChild(m);
 // pick
 var p=card("O‘zbekchaga mos so‘z","To‘g‘ri inglizcha so‘zni tanlang.");var tp="u"+u.n+"-pick";
 u.pick.forEach(function(k,i){var w=u.vocab[k];var others=shuffle(u.vocab.filter(function(_,j){return j!==k}),hash(tp+i)).slice(0,2).map(function(x){return x[0]});
  var opts=[w[0]].concat(others);choiceQ(p,tp,i,esc(w[1]),opts,0,true)});
 // row options shuffled for pick
 app.appendChild(p);shuffleRows(p);
 // spell
 var sp=card("So‘zni yozing","O‘zbekcha ma’nosiga qarab inglizcha yozing. Qiynalsangiz «Yordam»ni bosing.");var ts="u"+u.n+"-spell";
 u.spell.forEach(function(k,i){inputQ(sp,ts,i,esc(u.vocab[k][1]),u.vocab[k][0])});app.appendChild(sp)}
function shuffleRows(c){c.querySelectorAll(".opts.row").forEach(function(r,i){var ch=[].slice.call(r.children);shuffle(ch,hash(r.textContent)).forEach(function(x){r.appendChild(x)})})}

/* ---------- READING ---------- */
function glossify(p,gl){var out=esc(p);Object.keys(gl).sort(function(a,b){return b.length-a.length}).forEach(function(w){var re=new RegExp("(^|[^A-Za-z>])("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![A-Za-z<])");out=out.replace(re,function(m,a,b){return a+'<button class="gl" data-t="'+esc(gl[w])+'">'+b+"</button>"})});return out}
function reading(u,app){var r=u.reading;
 var c=card(esc(r.title),"Matnni o‘qing. Tagiga chizilgan so‘zlarni bosing – tarjimasi chiqadi.");var tx=el("div","text");
 r.text.forEach(function(p){tx.appendChild(el("p","",glossify(p,r.gloss)))});c.appendChild(tx);
 tx.querySelectorAll(".gl").forEach(function(g){g.onclick=function(){var on=g.classList.contains("show");tx.querySelectorAll(".gl.show").forEach(function(x){x.classList.remove("show")});if(!on)g.classList.add("show")}});
 var ls=el("button","btn ghost listen","🔊 Matnni tinglash");var playing=false;ls.onclick=function(){if(playing&&speechSynthesis.speaking){speechSynthesis.cancel();playing=false;ls.innerHTML="🔊 Matnni tinglash";return}speak(r.text.join(" "));playing=true;ls.innerHTML="⏹ To‘xtatish"};c.appendChild(ls);
 var d=el("details");d.innerHTML="<summary>O‘zbekcha tarjima</summary>"+r.uz.map(function(x){return"<p>"+esc(x)+"</p>"}).join("");c.appendChild(d);app.appendChild(c);
 var tf=card("True or False? · To‘g‘ri yoki noto‘g‘ri?","Matn bo‘yicha belgilang.");r.tf.forEach(function(x,i){choiceQ(tf,"u"+u.n+"-tf",i,esc(x[0]),["True ✓","False ✗"],x[1]?0:1,true)});app.appendChild(tf);
 var mc=card("Savollarga javob bering","Matn bo‘yicha javobni tanlang.");r.mcq.forEach(function(x,i){choiceQ(mc,"u"+u.n+"-mcq",i,esc(x[0]),x[1],0)});app.appendChild(mc);
 var fd=card("Matndan so‘zni toping","Matndagi mos so‘zni inglizcha yozing.");r.find.forEach(function(x,i){inputQ(fd,"u"+u.n+"-find",i,esc(x[0]),x[1])});app.appendChild(fd)}

/* ---------- GRAMMAR ---------- */
function grammar(u,app){
 u.grammar.forEach(function(g,gi){var tid="u"+u.n+"-g"+gi;var c=card(esc(g.name),"Shaklga keltiring, keyin to‘g‘ri gapni tanlang.");
  var rl=el("div","rule",g.note);c.appendChild(rl);
  g.form.forEach(function(x,i){inputQ(c,tid,i,esc(x[0]),x[1])});
  g.choose.forEach(function(x,i){choiceQ(c,tid,g.form.length+i,esc(x[0]),x[1],0)});
  app.appendChild(c)});
 var tid="u"+u.n+"-build";var b=card("Gap tuzing","So‘zlarni bosib, to‘g‘ri tartibda gap tuzing.");
 u.build.forEach(function(x,i){var sent=x[0],uz=x[1];var words=sent.split(" ");var q=qrow(b,i,esc(uz));
  var tray=el("div","tray"),pool=el("div","tray");pool.style.borderStyle="solid";pool.style.borderColor="transparent";pool.style.padding="0";
  var order=shuffle(words.map(function(_,k){return k}),hash(sent));if(order.join()===words.map(function(_,k){return k}).join())order.reverse();
  var picked=[];
  function draw(){tray.innerHTML="";picked.forEach(function(k,pi){var ch=el("button","chip",esc(words[k]));ch.onclick=function(){if(solved(tid,i))return;picked.splice(pi,1);draw()};tray.appendChild(ch)});
   [].forEach.call(pool.children,function(ch){ch.classList.toggle("used",picked.indexOf(+ch.dataset.k)>=0)})}
  order.forEach(function(k){var ch=el("button","chip",esc(words[k]));ch.dataset.k=k;ch.onclick=function(){if(solved(tid,i)||picked.indexOf(k)>=0)return;picked.push(k);tray.classList.remove("bad");draw()};pool.appendChild(ch)});
  var row=el("div","in");var ck=el("button","btn","Tekshirish"),cl=el("button","btn ghost","Tozalash");var tried=false;
  ck.onclick=function(){if(solved(tid,i))return;var s=picked.map(function(k){return words[k]}).join(" ");if(norm(s)===norm(sent)){tray.classList.add("ok");mark(tid,i,!tried);refresh()}else{tried=true;tray.classList.add("bad")}};
  cl.onclick=function(){if(solved(tid,i))return;picked=[];tray.classList.remove("bad");draw()};
  if(solved(tid,i)){picked=words.map(function(_,k){return k});tray.classList.add("ok")}
  q.appendChild(tray);q.appendChild(pool);row.appendChild(ck);row.appendChild(cl);q.appendChild(row);draw()});
 app.appendChild(b)}

/* ---------- WRITING ---------- */
function writing(u,app){var w=u.writing;
 app.appendChild(el("h2","",esc(w.title)));
 var tid="u"+u.n+"-err";var c=card("1-qadam · Xatolarni toping","Xato yozilgan so‘zlarni bosing (jami "+(w.errors.text.match(/(^| )\*/g)||[]).length+" ta), keyin «Tekshirish»ni bosing.");
 var box=el("div","err");var raw=w.errors.text.split(" ");var words=raw.map(function(x){return x.replace(/^\*/,"")});var WR=[];raw.forEach(function(x,k){if(x[0]==="*")WR.push(k)});w.errors.wrong=WR;var sel={};
 words.forEach(function(x,k){var b=el("button","ew",esc(x));b.onclick=function(){if(solved(tid,0))return;sel[k]=!sel[k];b.classList.toggle("sel",sel[k]);box.querySelectorAll(".miss,.wrong").forEach(function(z){z.classList.remove("miss","wrong")})};box.appendChild(b)});
 var fb=el("div","fb");var ck=el("button","btn","Tekshirish");var tried=false;
 function reveal(){var bs=box.children;w.errors.wrong.forEach(function(k){bs[k].classList.remove("sel");bs[k].classList.add("ok")});fb.className="fb ok";fb.innerHTML="To‘g‘ri! ✓ Tuzatilgan: <b>"+esc(w.errors.fixed)+"</b>"}
 ck.onclick=function(){if(solved(tid,0))return;var bs=box.children;var good=true;
  for(var k=0;k<words.length;k++){var isW=w.errors.wrong.indexOf(k)>=0;if(!!sel[k]!==isW){good=false;if(sel[k])bs[k].classList.add("wrong");}}
  if(good){mark(tid,0,!tried);reveal();refresh()}else{tried=true;fb.className="fb bad";fb.textContent="Hali hammasi emas. Qizil chizilganlar to‘g‘ri yozilgan; yana qidiring."}};
 c.appendChild(box);c.appendChild(ck);c.appendChild(fb);if(solved(tid,0))reveal();app.appendChild(c);
 var m=card("2-qadam · Namunani o‘qing","Namunadagi tuzilishga e’tibor bering.");var md=el("div","model","<b>"+esc(w.modelTitle)+"</b><br>"+w.model.map(esc).join("<br>"));m.appendChild(md);app.appendChild(m);
 var t=card("3-qadam · Navbat sizda ✍️",esc(w.task));var k="u"+u.n+"-write";
 var ta=el("textarea");ta.placeholder="Shu yerga ingliz tilida yozing…";ta.value=S.texts[k]||"";
 var cnt=el("div","small");var ul=el("ul","checks");
 w.checks.forEach(function(x){ul.appendChild(el("li","","○ "+esc(x[0])))});
 function upd(){var v=ta.value;S.texts[k]=v;var n=(v.match(/[^.!?]+[.!?]+/g)||[]).filter(function(s){return s.trim().split(/\s+/).length>=3}).length;cnt.textContent=n+" ta gap (maqsad: "+w.min+"–"+w.max+")";
  var all=n>=w.min;[].forEach.call(ul.children,function(li,i){var ok=i===0?n>=w.min:new RegExp(w.checks[i][1],"i").test(v);li.className=ok?"ok":"";li.textContent=(ok?"✓ ":"○ ")+w.checks[i][0];if(!ok)all=false});
  if(all){mark(k,0,true)}else if(S.items[itemKey(k,0)]){delete S.items[itemKey(k,0)]}save();refresh()}
 ta.oninput=upd;t.appendChild(ta);t.appendChild(cnt);t.appendChild(ul);
 var cp=el("button","btn","📋 Nusxa olib, o‘qituvchiga yuborish");cp.onclick=function(){copyReport(u)};t.appendChild(cp);
 t.appendChild(el("div","small","Matningiz shu qurilmada saqlanadi. Tugma matningiz va ballaringizni nusxalaydi – keyin uni o‘qituvchingizga xabar qilib yuboring."));
 app.appendChild(t);upd()}
function copyReport(u){var sc=unitScore(u),st=unitStat(u);
 var txt="📘 "+CONFIG.book+" · Unit "+u.n+": "+u.title+"\n👤 "+(S.name||"(ism yozilmagan)")+"\n✅ Topshiriqlar: "+st[0]+" / "+st[1]+"\n🎯 Birinchi urinishda to‘g‘ri: "+sc[0]+" / "+sc[1]+"\n\n✍️ "+u.writing.title+":\n"+(S.texts["u"+u.n+"-write"]||"(bo‘sh)");
 function ok(){toast("Nusxa olindi ✓")}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,function(){fallback(txt);ok()})}else{fallback(txt);ok()}}
function fallback(t){var a=el("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()}

/* ---------- router ---------- */
function route(){var m=location.hash.match(/^#u(\d+)-(vocab|reading|grammar|writing)$/);
 if(m){var u=UNITS.filter(function(x){return x.n==m[1]})[0];if(u)return unit(u,m[2])}
 CUR=null;home()}
window.addEventListener("hashchange",route);route();
})();
